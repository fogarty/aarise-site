# Déploie le thème sur Cloudways à chaque push sur main.
# Demande à Cloudways de faire un « git pull » via son API (la même action
# que le bouton « Pull » du panneau Deployment via Git).
#
# Authentification : Access Token Cloudways (remplace l'ancien email + API key,
# retiré le 15 octobre 2026), envoyé directement en Bearer.
#
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   CLOUDWAYS_ACCESS_TOKEN, CLOUDWAYS_SERVER_ID, CLOUDWAYS_APP_ID
# Variable (onglet Variables) :
#   CLOUDWAYS_DEPLOY_PATH  ex. wp-content/themes/aarise

name: Deploy to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudways-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger git pull on Cloudways
        env:
          CW_TOKEN: ${{ secrets.CLOUDWAYS_ACCESS_TOKEN }}
          CW_SERVER_ID: ${{ secrets.CLOUDWAYS_SERVER_ID }}
          CW_APP_ID: ${{ secrets.CLOUDWAYS_APP_ID }}
          CW_DEPLOY_PATH: ${{ vars.CLOUDWAYS_DEPLOY_PATH }}
        run: |
          # Retire espaces et retours à la ligne collés par erreur avec les secrets.
          token=$(printf '%s' "$CW_TOKEN" | tr -d '[:space:]')
          if [ -z "$token" ]; then
            echo "Secret CLOUDWAYS_ACCESS_TOKEN manquant" >&2
            exit 1
          fi

          response=$(curl -sS -X POST "https://api.cloudways.com/api/v1/git/pull" \
            -H "Authorization: Bearer $token" \
            --data-urlencode "server_id=$(printf '%s' "$CW_SERVER_ID" | tr -d '[:space:]')" \
            --data-urlencode "app_id=$(printf '%s' "$CW_APP_ID" | tr -d '[:space:]')" \
            --data-urlencode "git_url=git@github.com:${{ github.repository }}.git" \
            --data-urlencode "branch_name=main" \
            --data-urlencode "deploy_path=$CW_DEPLOY_PATH" \
            -w '\n%{http_code}')
          status=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")
          echo "Cloudways (HTTP $status): $(head -c 500 <<< "$body")"
          [ "$status" = "200" ]
